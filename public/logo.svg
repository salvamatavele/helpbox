<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 10)">
    <!-- Rounded Shield Background -->
    <rect width="80" height="80" rx="22" fill="url(#shieldGrad)" />
    <!-- Shield Outline -->
    <path d="M40 18 C56 18 64 25 64 25 C64 48 48 64 40 70 C32 64 16 48 16 25 C16 25 24 18 40 18 Z" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linejoin="round"/>
    <!-- Heart Symbol of Care & Listening -->
    <path d="M40 37 C37 32 30 32 27 36 C24 40 27 46 40 55 C53 46 56 40 53 36 C50 32 43 32 40 37 Z" fill="#2dd4bf"/>
  </g>

  <!-- Typography Brand Text -->
  <text x="110" y="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#0f172a" letter-spacing="-1">Help<tspan fill="#0d9488">box</tspan></text>
  <text x="112" y="80" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#64748b" letter-spacing="0.5">APOIO &amp; QUEIXAS NO ANONIMATO</text>
</svg>
